<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Login Lamborghini</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="login-body">

    <div class="container-login">

        <h1>🏎 Login</h1>

        <p class="subtitulo">
            Entre na sua conta
        </p>

        <input
            type="email"
            id="email"
            placeholder="Seu Email"
            required
        >

        <input
            type="password"
            id="senha"
            placeholder="Sua Senha"
            required
        >

        <button
            type="button"
            onclick="login()"
        >
            Entrar
        </button>

        <div class="links-login">
            <p>Não tem conta?</p>

            <a href="sign-in.html">
                Criar Conta
            </a>
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
