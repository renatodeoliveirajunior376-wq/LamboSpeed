<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Cadastro Lamborghini</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="login-body">

    <!-- VÍDEO DE FUNDO (OPCIONAL) -->
    <!--
    <video autoplay muted loop class="video-fundo">
        <source src="video.mp4" type="video/mp4">
    </video>
    -->

    <div class="container-login">

        <h1>🏎 Criar Conta</h1>

        <p class="subtitulo">
            Crie sua conta Lamborghini
        </p>

        <input
            type="text"
            id="nome"
            placeholder="Seu Nome"
            required
        >

        <input
            type="email"
            id="emailCadastro"
            placeholder="Seu Email"
            required
        >

        <input
            type="password"
            id="senhaCadastro"
            placeholder="Sua Senha"
            required
        >

        <button
            type="button"
            onclick="cadastrar()"
        >
            Criar Conta
        </button>

        <div class="links-login">
            <p>Já tem conta?</p>

            <a href="login.html">
                Fazer Login
            </a>
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
